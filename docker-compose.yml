services:
  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
    container_name: financeapp-cosmos
    restart: unless-stopped

    command:
      - --protocol
      - https

    ports:
      - "8081:8081"
      - "8080:8080"
      - "1234:1234"

    volumes:
      - ./docker/cosmos-data:/data